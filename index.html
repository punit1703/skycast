<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <!-- Left Sidebar for Current Weather -->
        <section class="left-panel">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for places...">
            </div>
            
            <div class="current-weather">
                <img id="weather-icon" src="" alt="Weather Icon">
                <h1 id="temperature">12°C</h1>
                <p class="day-time"><span id="current-day">Monday</span>, <span id="current-time">16:00</span></p>
                <hr>
                <div class="condition-info">
                    <p id="weather-condition">Mostly Cloudy</p>
                    <p id="rain-chance">Rain - 30%</p>
                </div>
                
                <div class="location-box">
                    <p id="city-name">New York, NY, USA</p>
                </div>
            </div>
        </section>

        <!-- Right Panel for Forecast & Highlights -->
        <section class="right-panel">
            <header class="top-bar">
                <nav class="tabs">
                    <button class="active">Today</button>
                    <button>Week</button>
                </nav>
                <div class="unit-toggle">
                    <button class="active">°C</button>
                    <button>°F</button>
                    <img src="profile-placeholder.jpg" alt="Profile" class="profile-img">
                </div>
            </header>
            
            <div class="forecast-container" id="forecast-container">
                <!-- Forecast cards generated by JS -->
            </div>

            <section class="highlights">
                <h2>Today's Highlights</h2>
                <div class="cards">
                    <div class="card">
                        <h4>Humidity</h4>
                        <p id="humidity">12%</p>
                        <span class="status">Normal 👍</span>
                    </div>
                    <div class="card">
                        <h4>Wind Speed</h4>
                        <p id="wind-speed">7.70 km/h</p>
                        <span class="status">WSW</span>
                    </div>
                    <div class="card">
                        <h4>Visibility</h4>
                        <p id="visibility">5.2 km</p>
                        <span class="status">Average 🙂</span>
                    </div>
                    <div class="card">
                        <h4>Pressure</h4>
                        <p id="pressure">1002 hPa</p>
                        <span class="status">High</span>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
